syntax = "proto3";
package bankApiGateway;
option java_package = "grpc";
option java_multiple_files = true;

message Cliente {
  string nome = 1;
  string CPF = 2;
  string saldo = 3;
}

message CadastroResponse {
  bool sucesso = 1;
  string mensagem = 2;
}
service ClienteService {
  rpc CadastrarMultiCliente(stream Cliente) returns (CadastroResponse);
  rpc CadastrarCliente (Cliente) returns (CadastroResponse);
}